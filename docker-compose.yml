
services:
  postgres:
    image: postgres:16
    container_name: mastodon_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: mastodon
      POSTGRES_USER: spark
      POSTGRES_PASSWORD: spark123

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spark -d mastodon"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-init:
    image: apache/kafka:3.9.1
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 1000:1000 /tmp/kraft-combined-logs"]

    volumes:
      - kafka_data:/tmp/kraft-combined-logs

    restart: "no"

  kafka:
    image: apache/kafka:3.9.1
    container_name: mastodon_kafka
    restart: unless-stopped

    depends_on:
      kafka-init:
        condition: service_completed_successfully

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

    volumes:
      - kafka_data:/tmp/kraft-combined-logs

    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  spark:
    build:
      context: .
      dockerfile: streaming/Dockerfile

    container_name: mastodon_spark

    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

    working_dir: /opt/spark/work-dir

    environment:
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3

      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: mastodon
      PGUSER: spark
      PGPASSWORD: spark123

    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:4040:4040"
      - "127.0.0.1:4041:4041"

    volumes:
      - ./:/opt/spark/work-dir

    command:
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --ServerApp.root_dir=/opt/spark/work-dir

volumes:
  postgres_data:
  kafka_data: