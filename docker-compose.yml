services:
  postgres:
    image: postgres:16
    container_name: mastodon_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: mastodon
      POSTGRES_USER: spark
      POSTGRES_PASSWORD: spark123

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  postgres_data: